name: Build & Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: file:/tmp/build-payload.db
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_SITE_URL_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_DOMAIN_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          PAYLOAD_PUBLIC_SERVER_URL_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
        run: npm run build

      - name: Copy static & public into standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public/. .next/standalone/public/

      - name: Create deployment archive
        run: zip -r next.zip .next

      - name: Set artifact name
        id: set-artifact
        run: echo "name=next-build-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: next.zip
          retention-days: 5

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build archive to server
        run: |
          scp next.zip ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/next.zip

      - name: Deploy on server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh $SSH_USER@$SSH_HOST << ENDSSH
            set -e
            cd $DEPLOY_PATH

            echo "==> Swapping build..."
            rm -rf .next
            unzip -q next.zip
            rm -f next.zip

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Regenerating Payload types & importmap..."
            npm run generate:types && npm run generate:importmap

            echo "==> Restarting app..."
            pm2 delete atech-website 2>/dev/null || true
            pm2 start npm --name "atech-website" --cwd $DEPLOY_PATH -- start
            pm2 save

            echo "==> Done"
            pm2 status
          ENDSSH
