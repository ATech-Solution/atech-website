name: Build & Deploy

# ─────────────────────────────────────────────────────────────
#  Trigger
#  dev  branch → build → deploy to UAT  (uat.atech.software)
#  main branch → build → deploy to PROD (site TBD)
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:

  # ── 1. Build ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: file:/tmp/build-payload.db
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_SITE_URL_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          NEXT_PUBLIC_DOMAIN_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
          PAYLOAD_PUBLIC_SERVER_URL_PROD: ${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
        run: npm run build

      - name: Copy static & public into standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public/. .next/standalone/public/

      - name: Create deployment archive
        run: zip -r next.zip .next/standalone

      - name: Set artifact name
        id: set-artifact
        run: echo "name=next-build-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: next.zip
          retention-days: 5

  # ── 2a. Deploy to UAT (dev branch) ────────────────────────
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment: uat

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build archive to UAT server
        run: |
          scp next.zip ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/next.zip

      - name: Deploy on UAT server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << ENDSSH
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Ensuring persistent dirs exist..."
            mkdir -p ${{ secrets.DEPLOY_PATH }}/data
            mkdir -p ${{ secrets.DEPLOY_PATH }}/public/media

            echo "==> Swapping build..."
            rm -rf standalone .next
            unzip -o -q next.zip
            mv .next/standalone standalone
            rm -rf .next next.zip

            echo "==> Pulling latest code..."
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ATech-Solution/atech-website.git dev

            echo "==> Installing dependencies..."
            npm install --ignore-scripts

            echo "==> Running database migrations..."
            DATABASE_URL="file:${{ secrets.DEPLOY_PATH }}/data/payload.db" PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}" npm run migrate

            echo "==> Regenerating Payload types & importmap..."
            npm run generate:types && npm run generate:importmap

            echo "==> Restarting app..."
            pm2 delete atech-website 2>/dev/null || true
            NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 DATABASE_URL="file:${{ secrets.DEPLOY_PATH }}/data/payload.db" PAYLOAD_MEDIA_DIR="${{ secrets.DEPLOY_PATH }}/public/media" PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}" NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}" NEXT_PUBLIC_SITE_URL_PROD="${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}" PAYLOAD_PUBLIC_SERVER_URL="${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}" PAYLOAD_PUBLIC_SERVER_URL_PROD="${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}" pm2 start ${{ secrets.DEPLOY_PATH }}/standalone/server.js --name "atech-website" --cwd ${{ secrets.DEPLOY_PATH }}/standalone
            pm2 save

            echo "==> Done"
            pm2 status
          ENDSSH

  # ── 2b. Deploy to Production (main branch) ────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build archive to production server
        run: |
          scp next.zip ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/next.zip

      - name: Deploy on production server
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << ENDSSH
            set -e
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            echo "==> Swapping build..."
            rm -rf standalone .next
            unzip -o -q next.zip
            mv .next/standalone standalone
            rm -rf .next next.zip

            echo "==> Pulling latest code..."
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ATech-Solution/atech-website.git main

            echo "==> Regenerating Payload types & importmap..."
            npm run generate:types && npm run generate:importmap

            echo "==> Restarting app..."
            pm2 delete atech-website-prod 2>/dev/null || true
            NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" PAYLOAD_SECRET="${{ secrets.PROD_PAYLOAD_SECRET }}" NEXT_PUBLIC_SITE_URL="${{ secrets.PROD_SITE_URL }}" PAYLOAD_PUBLIC_SERVER_URL="${{ secrets.PROD_SITE_URL }}" pm2 start ${{ secrets.PROD_DEPLOY_PATH }}/standalone/server.js --name "atech-website-prod" --cwd ${{ secrets.PROD_DEPLOY_PATH }}/standalone
            pm2 save

            echo "==> Done"
            pm2 status
          ENDSSH
